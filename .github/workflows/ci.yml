name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: aihappey-agents

    steps:
      - name: Checkout Agents
        uses: actions/checkout@v4
        with:
          path: aihappey-agents

      - name: Checkout Responses
        uses: actions/checkout@v4
        with:
          repository: achappey/aihappey-responses
          path: aihappey-responses

      - name: Checkout Vercel
        uses: actions/checkout@v4
        with:
          repository: achappey/aihappey-vercel
          path: aihappey-vercel

      - name: Checkout OpenAI
        uses: actions/checkout@v4
        with:
          repository: achappey/aihappey-openai
          path: aihappey-openai

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"

      - name: Run tests
        run: dotnet test .\core\AgentHappey.Tests\AgentHappey.Tests.csproj -c Release

      - name: Publish agents webapp
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $output = '.\artifacts\azure-headerauth'

          dotnet publish .\samples\AgentHappey.HeaderAuth\AgentHappey.HeaderAuth.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -o $output

          if ($LASTEXITCODE -ne 0) {
            throw 'Agents HeaderAuth publish failed.'
          }

          foreach ($file in @(
            'AgentHappey.HeaderAuth.dll',
            'AgentHappey.HeaderAuth.deps.json',
            'AgentHappey.HeaderAuth.runtimeconfig.json',
            'web.config'
          )) {
            if (-not (Test-Path (Join-Path $output $file) -PathType Leaf)) {
              throw "Missing Azure runtime file: $file"
            }
          }

      - name: Upload agents webapp artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: azure-headerauth
          path: aihappey-agents/artifacts/azure-headerauth/
          if-no-files-found: error

      # Existing standalone single-file build.
      - name: Publish Windows agents
        shell: pwsh
        run: |
          dotnet publish .\samples\AgentHappey.Windows\AgentHappey.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:WarningLevel=0 `
            -clp:ErrorsOnly `
            -o .\artifacts\windows

          if ($LASTEXITCODE -ne 0) {
            throw 'Standalone agents publish failed.'
          }

      - name: Zip standalone executable
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\artifacts\windows\* `
            -DestinationPath .\artifacts\aihappey-agents-windows-x64.zip `
            -Force

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest
          path: aihappey-agents/artifacts/aihappey-agents-windows-x64.zip
          if-no-files-found: error

      # Reusable multi-file runtime for aihappey-windows.
      - name: Publish reusable desktop agents runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = '.\artifacts\desktop-runtime'

          if (Test-Path $output) {
            Remove-Item $output -Recurse -Force
          }

          dotnet publish .\samples\AgentHappey.Windows\AgentHappey.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -clp:ErrorsOnly `
            -o $output

          if ($LASTEXITCODE -ne 0) {
            throw 'Desktop agents publish failed.'
          }

          # Verify required runtime files.
          foreach ($file in @(
            'AgentHappey.Windows.exe',
            'AgentHappey.Windows.dll',
            'AgentHappey.Windows.deps.json',
            'AgentHappey.Windows.runtimeconfig.json',
            'appsettings.json'
          )) {
            if (-not (Test-Path (Join-Path $output $file) -PathType Leaf)) {
              throw "Missing runtime file: $file"
            }
          }

          # Bundle the complete Agents directory.
          $source = (Resolve-Path '.\core\Agents\AgentHappey.Agents.JSON\Agents').Path
          $target = Join-Path $output 'Agents'

          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Get-ChildItem -LiteralPath $source -Force |
            Copy-Item -Destination $target -Recurse -Force

          # Validate all files recursively, including nested assets.
          $files = @(Get-ChildItem -LiteralPath $source -File -Recurse -Force)

          if ($files.Count -eq 0) {
            throw 'No agent files found.'
          }

          foreach ($file in $files) {
            $relative = [IO.Path]::GetRelativePath($source, $file.FullName)
            $published = Join-Path $target $relative

            if (-not (Test-Path -LiteralPath $published -PathType Leaf)) {
              throw "Missing published agent file: $relative"
            }

            $sourceHash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
            $publishedHash = (Get-FileHash -LiteralPath $published -Algorithm SHA256).Hash

            if ($sourceHash -ne $publishedHash) {
              throw "Published agent file differs: $relative"
            }
          }

          Write-Host "Validated $($files.Count) agent files."

          # Record the exact runtime source commit.
          @{
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
          } | ConvertTo-Json |
            Set-Content (Join-Path $output 'build-info.json') -Encoding utf8

          # Package complete multi-file runtime.
          Compress-Archive `
            -Path "$output\*" `
            -DestinationPath .\artifacts\aihappey-agents-runtime-win-x64.zip `
            -Force

      - name: Upload reusable desktop agents runtime
        uses: actions/upload-artifact@v4
        with:
          name: desktop-runtime-agents-win-x64
          path: aihappey-agents/artifacts/aihappey-agents-runtime-win-x64.zip
          if-no-files-found: error

  release-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-pack
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Agents
        uses: actions/checkout@v4

      - name: Download standalone artifact
        uses: actions/download-artifact@v4
        with:
          name: latest
          path: ./artifacts

      - name: Download reusable desktop runtime
        uses: actions/download-artifact@v4
        with:
          name: desktop-runtime-agents-win-x64
          path: ./artifacts

      - name: Update latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push origin latest --force

          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to update latest tag.'
          }

          if (gh release view latest 2>$null) {
            gh release upload latest `
              ./artifacts/aihappey-agents-windows-x64.zip `
              --clobber
          } else {
            gh release create latest `
              ./artifacts/aihappey-agents-windows-x64.zip `
              --title "Latest Windows build" `
              --notes "Latest standalone Windows agents build from main."
          }

          if ($LASTEXITCODE -ne 0) {
            throw 'Standalone agents release update failed.'
          }

          gh release upload latest `
            ./artifacts/aihappey-agents-runtime-win-x64.zip `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw 'Desktop agents runtime release update failed.'
          }

  deploy-azure:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-pack
    runs-on: windows-latest

    environment: production

    concurrency:
      group: aihappey-agents-production
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download agents webapp
        uses: actions/download-artifact@v4
        with:
          name: azure-headerauth
          path: ./artifacts/azure-headerauth

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy agents webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: aihappey-agents
          package: ./artifacts/azure-headerauth
